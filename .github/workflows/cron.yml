# Fallback scheduler for a Vercel Hobby project, whose crons run at most daily
# (ADR-0020). Build with VERCEL_CRON_PLAN=hobby, set the repository variable
# LATTE_URL and the secret CRON_SECRET, and this pings the work task every five
# minutes. On Vercel Pro the crons in .vercel/output/config.json do this; leave
# LATTE_URL unset and every run here skips.
name: cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  work:
    if: vars.LATTE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: drain the job queue
        env:
          LATTE_URL: ${{ vars.LATTE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" "$LATTE_URL/api/cron/work"
