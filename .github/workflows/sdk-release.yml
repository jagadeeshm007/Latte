# Publishes every SDK as one GitHub release, so any project can install it
# without a registry (sdks/README.md, ADR-0027, ADR-0031). Push a tag
# sdk-v<version> matching packages/sdk/package.json; the release gets:
#   latte-sdk-<version>.tgz, latte-sdk.tgz               TypeScript, pinned and latest
#   latte_sdk-<version>-py3-none-any.whl                 Python
#   latte-sdk-<version>.jar/.pom, latte-sdk.jar/.pom     Java, pinned and latest
# It also tags the Go module sdks/go/v<version> and moves sdk-latest here.
name: sdk-release

on:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: tag matches the package version
        run: |
          version=$(node -p "require('./packages/sdk/package.json').version")
          [ "$GITHUB_REF_NAME" = "sdk-v$version" ] || { echo "tag $GITHUB_REF_NAME, package $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: make sdk-pack
      - name: the generated SDKs match the API and pass their tests
        run: |
          make sdks
          [ -z "$(git status --porcelain -- sdks)" ] || { echo "sdks/ is stale: run make sdks"; exit 1; }
          make sdks-test
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "packages/sdk/latte-sdk-$VERSION.tgz" packages/sdk/latte-sdk.tgz
          jar="sdks/java/target/latte-sdk-$VERSION.jar"
          cp sdks/java/pom.xml "sdks/java/target/latte-sdk-$VERSION.pom"
          cp "$jar" sdks/java/target/latte-sdk.jar
          cp sdks/java/pom.xml sdks/java/target/latte-sdk.pom
          gh release create "$GITHUB_REF_NAME" \
            "packages/sdk/latte-sdk-$VERSION.tgz" packages/sdk/latte-sdk.tgz \
            "sdks/python/dist/latte_sdk-$VERSION-py3-none-any.whl" \
            "$jar" "sdks/java/target/latte-sdk-$VERSION.pom" \
            sdks/java/target/latte-sdk.jar sdks/java/target/latte-sdk.pom \
            --title "Latte SDKs $VERSION" \
            --notes "TypeScript, Python, Go and Java clients $VERSION. Install commands: sdks/README.md."
      - name: tag the Go module and move sdk-latest
        run: |
          git tag "sdks/go/v$VERSION" "$GITHUB_SHA"
          git push origin "sdks/go/v$VERSION"
          # sdk-latest is the one tag that moves: installs from git that want the newest release use it.
          git tag -f sdk-latest "$GITHUB_SHA"
          git push -f origin sdk-latest
