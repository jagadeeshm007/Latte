<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Latte · Sales call compliance and coaching</title>
    <meta
      name="description"
      content="Latte transcribes and scores every sales call against your compliance and quality rubric, sends risky calls to QA with playable evidence, and turns the rest into coaching. Open source."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Latte" />
    <meta property="og:title" content="Latte · Sales call compliance and coaching" />
    <meta
      property="og:description"
      content="Every sales call checked against your rubric, in English and ten Indian languages. Open source, with a public API and SDKs."
    />
    <meta name="twitter:card" content="summary" />
    <script>
      // Same rule as src/lib/theme.ts, run before first paint so dark never flashes light.
      (function () {
        var t = "system";
        try {
          t = localStorage.getItem("scc-theme") || "system";
        } catch (e) {}
        var dark =
          t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
