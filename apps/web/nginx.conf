# SalesCallWeb: single-page app on an unprivileged nginx (port 8080).
# TLS, HSTS and rate limits belong on the ingress in front of this container.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Widen connect-src when the API lives on another origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Container liveness, distinct from the API's own /healthz.
    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Hashed assets are immutable; index.html is not. `expires` is used instead
    # of add_header so the security headers above still reach these locations
    # (an add_header in a location replaces every inherited add_header).
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # Same-origin API: uncomment and point at the service.
    # location /api/ {
    #     proxy_pass http://api:8080/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
