# One origin for the local stack (ADR-0028). The API and worker share this
# container's network, so they reach Supabase at http://localhost:8000 too and
# the upload and playback URLs they sign work in the browser unchanged.
server {
  listen 8000;
  client_max_body_size 60m;
  # Docker's DNS, so a service that starts late is found when it is up.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $auth http://auth:9999;
  set $storage http://storage:5000;

  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $http_host;

  location /auth/v1/ {
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass $auth;
  }

  location /storage/v1/ {
    rewrite ^/storage/v1/(.*)$ /$1 break;
    proxy_set_header X-Forwarded-Prefix /storage/v1;
    proxy_request_buffering off;
    proxy_pass $storage;
  }

  location /api/ {
    proxy_read_timeout 300s;
    proxy_pass http://127.0.0.1:8080;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  # The public docs as raw Markdown, for people and LLMs (llms.txt).
  location ~ ^/(docs|legal)/.+\.md$ {
    root /usr/share/nginx/html;
    default_type text/markdown;
    charset utf-8;
  }
  location ~ ^/llms(-full)?\.txt$ {
    root /usr/share/nginx/html;
    charset utf-8;
  }

  location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
