openapi: 3.1.0
info:
  description: "Sales call compliance and coaching. Authenticate with `Authorization:\
    \ Bearer latte_…`. Every response carries RateLimit-Limit, RateLimit-Remaining\
    \ and RateLimit-Reset headers. Create requests accept an `Idempotency-Key` header.\
    \ Webhooks are signed with `Latte-Signature`; see the `webhooks` section."
  license:
    name: MIT
  title: Latte API
  version: 0.3.0
servers:
- url: /
security:
- apiKey: []
tags:
- description: "Who the key acts as, and the agents, teams and products to upload\
    \ against."
  name: Account
- description: "Calls with their transcript, score and findings."
  name: Calls
- description: "Add calls: sign upload URLs for recordings and confirm them, or send\
    \ transcripts with no audio."
  name: Uploads
- description: "Calls uploaded together, with their progress and results."
  name: Batches
- description: "Batch results as CSV, and transcripts and recordings as a ZIP."
  name: Exports
- description: "Scores and flags grouped by team, product, agent or language."
  name: Analytics
- description: Endpoints that receive signed events. The events themselves are described
    under `webhooks`.
  name: Webhooks
paths:
  /api/me:
    get:
      description: ""
      operationId: getMe
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: 400, 401, 403, 404, 409, 413, 422 or 429 (with Retry-After)"
      summary: The manager the key acts as
      tags:
      - Account
      x-rate-limit-bucket: read
  /api/reference:
    get:
      description: Needs the `calls:read` scope.
      operationId: getReference
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reference"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: 400, 401, 403, 404, 409, 413, 422 or 429 (with Retry-After)"
      summary: "Agents, teams and products to upload against"
      tags:
      - Account
      x-rate-limit-bucket: read
  /api/calls:
    get:
      description: "Filter by status, flag, agent, team, product, language, batch\
        \ or text. Paged with `limit` and `page`, or `cursor`. Needs the `calls:read`\
        \ scope."
      operationId: listCalls
      parameters:
      - explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - uploaded
          - transcribing
          - transcribed
          - scoring
          - scored
          - failed
          type: string
        style: form
      - explode: true
        in: query
        name: needsReview
        required: false
        schema:
          enum:
          - "true"
          - "false"
          type: string
        style: form
      - explode: true
        in: query
        name: agentId
        required: false
        schema:
          format: uuid
          pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
          type: string
        style: form
      - explode: true
        in: query
        name: teamId
        required: false
        schema:
          format: uuid
          pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
          type: string
        style: form
      - explode: true
        in: query
        name: productId
        required: false
        schema:
          format: uuid
          pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
          type: string
        style: form
      - explode: true
        in: query
        name: language
        required: false
        schema:
          enum:
          - en-IN
          - hi-IN
          - bn-IN
          - ta-IN
          - te-IN
          - kn-IN
          - ml-IN
          - mr-IN
          - gu-IN
          - od-IN
          - pa-IN
          - auto
          type: string
        style: form
      - explode: true
        in: query
        name: flag
        required: false
        schema:
          enum:
          - flagged
          - passed
          - pending
          type: string
        style: form
      - explode: true
        in: query
        name: q
        required: false
        schema:
          maxLength: 100
          type: string
        style: form
      - explode: true
        in: query
        name: batchId
        required: false
        schema:
          format: uuid
          pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
          type: string
        style: form
      - explode: true
        in: query
        name: archived
        required: false
        schema:
          enum:
          - "true"
          - "false"
          type: string
        style: form
      - explode: true
        in: query
        name: groupBy
        required: false
        schema:
          enum:
          - agent
          - team
          - product
          - language
          - status
          - flag
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          maximum: 10000
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallList"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: 400, 401, 403, 404, 409, 413, 422 or 429 (with Retry-After)"
      summary: List calls
      tags:
      - Calls
      x-rate-limit-bucket: read
  /api/calls/{id}:
    get:
      description: Personal data in the transcript and quotes is masked for API keys.
        Needs the `calls:read` scope.
      operationId: getCall
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallDetail"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: 400, 401, 403, 404, 409, 413, 422 or 429 (with Retry-After)"
      summary: One call with its transcript and findings
      tags:
      - Calls
      x-rate-limit-bucket: read
  /api/calls/{id}/audio-url:
    post:
      description: Needs the `calls:read` scope.
      operationId: getAudioUrl
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioUrlRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioUrl"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: 400, 401, 403, 404, 409, 413, 422 or 429 (with Retry-After)"
      summary: A short-lived link to the recording
      tags:
      - Calls
      x-rate-limit-bucket: read
  /api/uploads/sign:
    post:
      description: "PUT each file to its `signedUrl`, then call confirmUploads with\
        \ the returned paths. Needs the `calls:write` scope."
      operationId: signUploads
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadSignRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSignResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: 400, 401, 403, 404, 409, 413, 422 or 429 (with Retry-After)"
      summary: Signed upload URLs for up to 50 recordings
      tags:
      - Uploads
      x-rate-limit-bucket: single or batch
  /api/uploads/confirm:
    post:
      description: Accepts an `Idempotency-Key` header. Needs the `calls:write` scope.
      operationId: confirmUploads
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadConfirmRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: 400, 401, 403, 404, 409, 413, 422 or 429 (with Retry-After)"
      summary: "Create calls from uploaded recordings, into a new or existing batch"
      tags:
      - Uploads
      x-rate-limit-bucket: single or batch
  /api/uploads/transcripts:
    post:
      description: "Give times on every line or on none; without times, findings point\
        \ to line numbers. Accepts an `Idempotency-Key` header. Needs the `calls:write`\
        \ scope."
      operationId: uploadTranscripts
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptUploadRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: 400, 401, 403, 404, 409, 413, 422 or 429 (with Retry-After)"
      summary: "Create calls from transcripts, with no audio, into a new or existing\
        \ batch"
      tags:
      - Uploads
      x-rate-limit-bucket: single or batch
  /api/calls/{id}/retry:
    post:
      description: Needs the `calls:write` scope.
      operationId: retryCall
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallRetryResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: 400, 401, 403, 404, 409, 413, 422 or 429 (with Retry-After)"
      summary: Queue a failed or stuck call again
      tags:
      - Calls
      x-rate-limit-bucket: single
  /api/calls/{id}/archive:
    post:
      description: Needs the `calls:write` scope.
      operationId: archiveCall
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Done; no body
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: 400, 401, 403, 404, 409, 413, 422 or 429 (with Retry-After)"
      summary: Hide a call from lists
      tags:
      - Calls
      x-rate-limit-bucket: single
  /api/calls/{id}/unarchive:
    post:
      description: Needs the `calls:write` scope.
      operationId: unarchiveCall
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Done; no body
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: 400, 401, 403, 404, 409, 413, 422 or 429 (with Retry-After)"
      summary: Bring an archived call back
      tags:
      - Calls
      x-rate-limit-bucket: single
  /api/batches:
    get:
      description: Needs the `batches:read` scope.
      operationId: listBatches
      parameters:
      - explode: true
        in: query
        name: q
        required: false
        schema:
          maxLength: 100
          type: string
        style: form
      - explode: true
        in: query
        name: state
        required: false
        schema:
          enum:
          - processing
          - completed
          - has_failures
          type: string
        style: form
      - explode: true
        in: query
        name: archived
        required: false
        schema:
          enum:
          - "true"
          - "false"
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          maximum: 10000
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchList"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: 400, 401, 403, 404, 409, 413, 422 or 429 (with Retry-After)"
      summary: List batches
      tags:
      - Batches
      x-rate-limit-bucket: read
  /api/batches/{id}:
    get:
      description: Needs the `batches:read` scope.
      operationId: getBatch
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchDetail"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: 400, 401, 403, 404, 409, 413, 422 or 429 (with Retry-After)"
      summary: One batch with its progress and results
      tags:
      - Batches
      x-rate-limit-bucket: read
    patch:
      description: Needs the `batches:write` scope.
      operationId: updateBatch
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchDetail"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: 400, 401, 403, 404, 409, 413, 422 or 429 (with Retry-After)"
      summary: Rename or archive a batch
      tags:
      - Batches
      x-rate-limit-bucket: single
  /api/batches/{id}/retry-failed:
    post:
      description: Accepts an `Idempotency-Key` header. Needs the `batches:write`
        scope.
      operationId: retryFailedCalls
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchRetryResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: 400, 401, 403, 404, 409, 413, 422 or 429 (with Retry-After)"
      summary: Queue every failed call in the batch again
      tags:
      - Batches
      x-rate-limit-bucket: batch
  /api/batches/{id}/results.csv:
    get:
      description: Needs the `exports:read` scope.
      operationId: getBatchResultsCsv
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            text/csv:
              schema:
                format: binary
                type: string
          description: The file
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: 400, 401, 403, 404, 409, 413, 422 or 429 (with Retry-After)"
      summary: "Results, one row per call and one column per rubric item"
      tags:
      - Exports
      x-rate-limit-bucket: bulk
  /api/batches/{id}/export.zip:
    get:
      description: Needs the `exports:read` scope.
      operationId: exportBatchZip
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: true
        in: query
        name: include
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/zip:
              schema:
                format: binary
                type: string
          description: The file
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: 400, 401, 403, 404, 409, 413, 422 or 429 (with Retry-After)"
      summary: "Results, transcripts and recordings as a ZIP (up to 200 calls)"
      tags:
      - Exports
      x-rate-limit-bucket: bulk
  /api/dashboard:
    get:
      description: Needs the `analytics:read` scope.
      operationId: getDashboard
      parameters:
      - explode: true
        in: query
        name: groupBy
        required: false
        schema:
          default: team
          enum:
          - team
          - product
          - agent
          - language
          type: string
        style: form
      - explode: true
        in: query
        name: from
        required: false
        schema:
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          type: string
        style: form
      - explode: true
        in: query
        name: to
        required: false
        schema:
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: 400, 401, 403, 404, 409, 413, 422 or 429 (with Retry-After)"
      summary: "Results grouped by team, product, agent or language"
      tags:
      - Analytics
      x-rate-limit-bucket: read
  /api/dashboard/highlights:
    get:
      description: Needs the `analytics:read` scope.
      operationId: getHighlights
      parameters:
      - explode: true
        in: query
        name: from
        required: false
        schema:
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          type: string
        style: form
      - explode: true
        in: query
        name: to
        required: false
        schema:
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Highlights"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: 400, 401, 403, 404, 409, 413, 422 or 429 (with Retry-After)"
      summary: The period's headline numbers and highlights
      tags:
      - Analytics
      x-rate-limit-bucket: read
  /api/dashboard/leaderboard:
    get:
      description: Needs the `analytics:read` scope.
      operationId: getLeaderboard
      parameters:
      - explode: true
        in: query
        name: groupBy
        required: false
        schema:
          default: agent
          enum:
          - team
          - product
          - agent
          - language
          type: string
        style: form
      - explode: true
        in: query
        name: q
        required: false
        schema:
          maxLength: 100
          type: string
        style: form
      - explode: true
        in: query
        name: sort
        required: false
        schema:
          default: avgScore
          enum:
          - name
          - calls
          - avgScore
          - flagRate
          - breaches
          type: string
        style: form
      - explode: true
        in: query
        name: dir
        required: false
        schema:
          default: desc
          enum:
          - asc
          - desc
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          maximum: 10000
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 25
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: minCalls
        required: false
        schema:
          default: 1
          maximum: 10000
          minimum: 0
          type: integer
        style: form
      - explode: true
        in: query
        name: from
        required: false
        schema:
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          type: string
        style: form
      - explode: true
        in: query
        name: to
        required: false
        schema:
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leaderboard"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: 400, 401, 403, 404, 409, 413, 422 or 429 (with Retry-After)"
      summary: "A sorted, paged ranking of any grouping"
      tags:
      - Analytics
      x-rate-limit-bucket: read
  /api/webhooks:
    get:
      description: Needs the `webhooks:write` scope.
      operationId: listWebhooks
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointList"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: 400, 401, 403, 404, 409, 413, 422 or 429 (with Retry-After)"
      summary: List webhook endpoints
      tags:
      - Webhooks
      x-rate-limit-bucket: read
    post:
      description: Accepts an `Idempotency-Key` header. Needs the `webhooks:write`
        scope.
      operationId: createWebhook
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedWebhook"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: 400, 401, 403, 404, 409, 413, 422 or 429 (with Retry-After)"
      summary: Register an https endpoint; the signing secret is returned once
      tags:
      - Webhooks
      x-rate-limit-bucket: single
  /api/webhooks/{id}:
    delete:
